name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          cd backend
          uv pip install --system -r requirements.txt

      - name: Check Syntax
        run: |
          python -m py_compile backend/*.py

      - name: Run Tests
        run: |
          cd backend
          python -m pytest

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decode Profile Image from Secret
        env:
          PROFILE_PHOTO_BASE64: ${{ secrets.PROFILE_PHOTO_BASE64 }}
        run: |
          if [ -n "$PROFILE_PHOTO_BASE64" ]; then
            echo "Decoding profile image from secret..."
            echo "$PROFILE_PHOTO_BASE64" | base64 --decode > profile.jpg
          else
            echo "No PROFILE_PHOTO_BASE64 secret provided, using default profile.jpg."
          fi

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Workspace as Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository contents
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Backend to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd backend
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Deploy to Hugging Face Spaces"
          git remote add hf https://rahulhirur:${HF_TOKEN}@huggingface.co/spaces/rahulhirur/rahulhirur-portfolio-ai
          git push --force hf HEAD:main

      - name: Track Hugging Face Build Status
        run: |
          python -c "
          import urllib.request, json, time, sys
          url = 'https://huggingface.co/api/spaces/rahulhirur/rahulhirur-portfolio-ai'
          print('Polling Hugging Face space status...')
          # Wait 10 seconds for build trigger to register on Hugging Face
          time.sleep(10)
          for i in range(60):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      runtime = data.get('runtime', {})
                      stage = runtime.get('stage', '')
                      print(f'Attempt {i+1}: Current Hugging Face stage: {stage}')
                      if stage == 'RUNNING':
                          print('Space is running successfully!')
                          sys.exit(0)
                      elif stage in ['BUILDING', 'RUNNING_BUILDING', 'PAUSED', 'APP_STARTING', 'SLEEPING']:
                          pass
                      elif stage in ['BUILD_ERROR', 'RUNTIME_ERROR', 'ERROR']:
                          print(f'Build failed with stage: {stage}')
                          sys.exit(1)
                      else:
                          print(f'Warning: Unexpected stage: {stage}')
              except Exception as e:
                  print(f'Error querying status: {e}')
              time.sleep(15)
          print('Timeout waiting for Hugging Face space build to complete.')
          sys.exit(1)
          "
