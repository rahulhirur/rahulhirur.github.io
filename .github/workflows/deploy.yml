name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying static content
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Decode Profile Image from Secret
        env:
          PROFILE_PHOTO_BASE64: ${{ secrets.PROFILE_PHOTO_BASE64 }}
        run: |
          if [ -n "$PROFILE_PHOTO_BASE64" ]; then
            echo "Decoding profile image from secret..."
            echo "$PROFILE_PHOTO_BASE64" | base64 --decode > profile.jpg
          else
            echo "No PROFILE_PHOTO_BASE64 secret provided, using default profile.jpg."
          fi

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Upload Workspace as Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository contents
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy Backend to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd backend
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Deploy to Hugging Face Spaces"
          git remote add hf https://rahulhirur:${HF_TOKEN}@huggingface.co/spaces/rahulhirur/rahulhirur-portfolio-ai
          git push --force hf HEAD:main
